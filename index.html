
<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>CTWW Room Monitor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <p class="eyebrow">CTWW COMMUNITY TOOL</p>
      <h1>CTWW Room Monitor</h1>
      <p class="subtitle">お気に入りのプレイヤーのオンライン状態を通知します。</p>
    </header>

    <section class="panel">
      <h2>プレイヤー監視</h2>
      <label for="playerName">プレイヤー名</label>
      <input id="playerName" type="text"
             placeholder="プレイヤー名を入力">
      <button id="savePlayer" type="button">監視対象を設定</button>
      <p id="playerStatus" class="status" aria-live="polite">
        まだ監視対象は設定されていません。
      </p>
    </section>

    <section class="panel">
      <h2>プッシュ通知</h2>
      <p>通知を許可すると、対応ブラウザーでオンライン通知を受け取れるようになります。</p>
      <button id="enablePush" type="button">
        通知を設定する
      </button>
      <p id="pushStatus" class="status" aria-live="polite">
        通知はまだ設定されていません。
      </p>
    </section>

    <footer>
      <p>CTWW Room Monitor · Community tool</p>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
