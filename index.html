
<!doctype html>
<meta charset="utf-8">
<title>VAPID Key Generator</title>

<h2>CTWW Room Monitor - VAPID鍵生成</h2>
<button id="generate">鍵を生成</button>

<p>公開鍵</p>
<textarea id="publicKey" rows="3" cols="70" readonly></textarea>

<p>秘密鍵（他人に共有しないこと）</p>
<textarea id="privateKey" rows="3" cols="70" readonly></textarea>

<script>
function base64url(bytes) {
  let binary = "";
  for (const byte of bytes) binary += String.fromCharCode(byte);

  return btoa(binary)
    .replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=+$/, "");
}

document.querySelector("#generate").addEventListener("click", async () => {
  const pair = await crypto.subtle.generateKey(
    { name: "ECDSA", namedCurve: "P-256" },
    true,
    ["sign", "verify"]
  );

  const jwk = await crypto.subtle.exportKey("jwk", pair.privateKey);

  const decode = (s) => {
    const padded = s.replace(/-/g, "+").replace(/_/g, "/")
      + "=".repeat((4 - s.length % 4) % 4);
    return Uint8Array.from(atob(padded), c => c.charCodeAt(0));
  };

  const x = decode(jwk.x);
  const y = decode(jwk.y);
  const d = decode(jwk.d);

  const publicBytes = new Uint8Array(65);
  publicBytes[0] = 4;
  publicBytes.set(x, 1);
  publicBytes.set(y, 33);

  document.querySelector("#publicKey").value = base64url(publicBytes);
  document.querySelector("#privateKey").value = base64url(d);
});
</script>
